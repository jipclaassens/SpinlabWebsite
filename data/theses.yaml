# The theses on /supervised-theses/. This site is the only place where these theses are public: they
# are handed in at the university but not published anywhere else, so this list matters.
#
# The way to add one is the "Thesis" form under Issues, which also puts the pdf on the web server: pdfs
# do not go in this repository. Corrections to a thesis can be made in its block under theses: below.
# The order does not matter, the site sorts by date. Students give permission for publication when
# they hand in their thesis at the VU.
#
#   author      as it should appear
#   title       the title
#   degree      for example MSc thesis STREEM
#   programme   one of the keys under programmes
#   date        the date it was graded, as 2026-08-20; or year: 2016 if only the year is known
#   supervisor  optional
#   note        optional, for example that only the introduction is public
#   file        the pdf, as /files/theses/author-year-title.pdf; leave out if there is no public copy
#   attachments optional, further documents such as a data annex, each with a label and a file
#   slug        the last part of its web address, the same author-year-title; do not change it once it is online

