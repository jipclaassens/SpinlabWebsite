# The People page is built from this file.
#
# Somebody joins: copy a block, change the name and role.
# Somebody leaves: change their group to former.
# Keep it short. Phone numbers, rooms and publication lists live in the research portal (Pure), so
# they stay correct without anyone having to update them here.
#
#   name     full name
#   role     what they do at SPINlab
#   group    staff, phd, affiliates or former
#   pure     the last part of their address on research.vu.nl/en/persons/ (optional)
#   feed     true: their recent publications appear on this site (optional)
#   page     their page on this site (optional)
#   email    only if it is meant to be public (optional)
#   photo    a file in static/files/people/, for example /files/people/name.jpg (optional)
#
# Set verified to true once the list has been checked; until then the build prints a warning.
verified: false

groups:
  staff: Staff
  phd: PhD researchers
  affiliates: Affiliated researchers and advisors
  former: Former members
