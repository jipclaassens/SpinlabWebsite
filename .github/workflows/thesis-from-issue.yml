# Adds a thesis from a filled-in "Thesis" issue once somebody with write access adds the label
# "publish". Students give permission for publication when they hand in their thesis at the VU; the
# form makes the sender confirm that, and the script checks the box again.
#
# The pdf goes to the web server, not into git. That comes before the commit, so a failed upload does
# not leave a link to nothing. This workflow uses the same secrets and variables as build-and-deploy.yml.
#
# A push made with the workflow's own token does not start other workflows, so this one starts the
# deploy itself.
name: Thesis from issue

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  publish:
    if: ${{ github.event.label.name == 'publish' && contains(github.event.issue.labels.*.name, 'thesis') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stop when there is no server yet
        if: ${{ vars.DEPLOY_ENABLED != 'true' }}
        run: |
          echo "::error::The web server is not set up yet, so there is no place for the pdf."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install PyYAML

      # the issue text goes in through the environment, never into the shell command itself
      - name: Add the thesis
        id: write
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/issue_to_thesis.py

      - name: Upload the pdf to the webserver
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ vars.DEPLOY_USER }}@spinlab.vu.nl:${{ vars.DEPLOY_DIR }}
          DOCUMENT: ${{ steps.write.outputs.document }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          python tools/documents.py upload "$TARGET" --only "$DOCUMENT" --key ~/.ssh/deploy_key

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          PAGE: ${{ steps.write.outputs.url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/theses.yaml data/documents.yaml
          git commit --cleanup=whitespace -m "Add a supervised thesis" -m "From the Thesis form, issue $ISSUE."
          git push
          gh workflow run build-and-deploy.yml --ref main
          gh issue close "$ISSUE" --comment "Published. It will be at $PAGE within a few minutes."
