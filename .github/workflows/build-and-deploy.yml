# Builds spinlab.vu.nl from content/ and data/ and uploads it to the webserver.
#
# A push to main publishes, so a commit made on github.com is live a few minutes later. A broken
# internal link or a mistake in a data file makes the build fail: the old site then stays up and
# whoever committed gets an email from GitHub.
#
# Publishing stays off until the variable DEPLOY_ENABLED is set to true, so the repository can be
# used before the server is ready. The server takes ssh keys, not passwords.
#
# Repository secrets:   DEPLOY_SSH_KEY (a private key made for this purpose, without a passphrase),
#                       DEPLOY_KNOWN_HOSTS (the line ssh-keyscan spinlab.vu.nl gives)
# Repository variables: DEPLOY_ENABLED (true), DEPLOY_USER, DEPLOY_DIR (the folder the site lives in)
#
# rsync --delete empties the target of everything that is not in the site, except what
# tools/upload-rules.txt protects: the documents, which are only on the server. Point DEPLOY_DIR at a
# folder of its own, never at a folder that still holds WordPress.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1"   # every Monday, so new publications in the research portal appear

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The portal sometimes refuses a request from a shared address. The build then uses the
      # list committed in data/, which is why this step may fail.
      - name: Refresh recent publications
        continue-on-error: true
        run: python tools/fetch_pure.py

      - name: Build and check internal links
        run: python build.py --check

      # A pdf uploaded through github.com would stay in the history for good.
      - name: Documents stay out of git
        run: |
          if git -c core.quotePath=off ls-files static | grep -viE '\.(jpg|jpeg|png|gif|webp|svg)$'; then
            echo "::error::These files are documents. They belong on the web server, see Documents in CLAUDE.md."
            exit 1
          fi

      # The server holds the only copy of the documents, so the upload is tried on a folder here first.
      - name: The upload leaves the documents alone
        run: |
          mkdir -p /tmp/server/files/theses
          touch /tmp/server/files/theses/document.pdf /tmp/server/files/theses/picture-taken-out.jpg /tmp/server/page-taken-out.html
          rsync -rlz --delete --filter='merge tools/upload-rules.txt' _site/ /tmp/server/
          test -f /tmp/server/files/theses/document.pdf
          test -f /tmp/server/files/theses/index.html
          test ! -e /tmp/server/files/theses/picture-taken-out.jpg
          test ! -e /tmp/server/page-taken-out.html

      # The check on the documents comes first: when one is missing, the old site stays up.
      - name: Upload to the webserver
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ vars.DEPLOY_USER }}@spinlab.vu.nl:${{ vars.DEPLOY_DIR }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          python tools/documents.py status "$TARGET" --key ~/.ssh/deploy_key
          rsync -rlz --delete --chmod=D775,F664 --filter='merge tools/upload-rules.txt' -e "ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes" _site/ "$TARGET/"
