# Builds spinlab.vu.nl from content/ and data/ and uploads it to the webserver.
#
# A push to main publishes, so a commit made on github.com is live a few minutes later. A broken
# internal link or a mistake in a data file makes the build fail: the old site then stays up and
# whoever committed gets an email from GitHub.
#
# Publishing stays off until the variable DEPLOY_ENABLED is set to true, so the repository can be
# used before the server is ready. The server takes ssh keys, not passwords.
#
# Repository secrets:   DEPLOY_SSH_KEY (a private key made for this purpose, without a passphrase),
#                       DEPLOY_KNOWN_HOSTS (the line ssh-keyscan spinlab.vu.nl gives)
# Repository variables: DEPLOY_ENABLED (true), DEPLOY_USER, DEPLOY_DIR (the folder the site lives in)
#
# rsync --delete empties the target of everything that is not in the site. Point DEPLOY_DIR at a
# folder of its own, never at a folder that still holds WordPress.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1"   # every Monday, so new publications in the research portal appear

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The portal sometimes refuses a request from a shared address. The build then uses the
      # list committed in data/, which is why this step may fail.
      - name: Refresh recent publications
        continue-on-error: true
        run: python tools/fetch_pure.py

      - name: Build and check internal links
        run: python build.py --check

      - name: Upload to the webserver
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ vars.DEPLOY_USER }}@spinlab.vu.nl:${{ vars.DEPLOY_DIR }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlz --delete --chmod=D755,F644 -e "ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes" _site/ "$TARGET/"
