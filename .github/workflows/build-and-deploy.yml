# Builds spinlab.vu.nl from content/ and data/ and uploads it to the webserver.
#
# A push to main publishes, so a commit made on github.com is live a few minutes later. A broken
# internal link or a mistake in a data file makes the build fail: the old site then stays up and
# whoever committed gets an email from GitHub.
#
# Publishing stays off until the variable DEPLOY_ENABLED is set to true, so the repository can be
# used before the server account exists.
#
# Repository secrets:   DEPLOY_HOST, DEPLOY_USER, DEPLOY_PASSWORD
# Repository variables: DEPLOY_ENABLED (true), DEPLOY_PROTOCOL (sftp or ftps), DEPLOY_DIR (the web
#                       root relative to the login directory, default ".")
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1"   # every Monday, so new publications in the research portal appear

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The portal sometimes refuses a request from a shared address. The build then uses the
      # list committed in data/, which is why this step may fail.
      - name: Refresh recent publications
        continue-on-error: true
        run: python tools/fetch_pure.py

      - name: Build and check internal links
        run: python build.py --check

      - name: Upload to the webserver
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          LFTP_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          PROTOCOL: ${{ vars.DEPLOY_PROTOCOL || 'sftp' }}
          REMOTE_DIR: ${{ vars.DEPLOY_DIR || '.' }}
        run: |
          sudo apt-get install -y -qq lftp
          # Documents keep their size when they keep their content, and uploading them all on
          # every commit would take very long, so they are compared on size alone. Pages are
          # always written again. --delete removes what is no longer in the site.
          lftp --env-password -u "$USER_NAME" "$PROTOCOL://$HOST" <<EOF
          set sftp:auto-confirm yes
          set ftp:ssl-force true
          set net:max-retries 3
          set net:timeout 60
          mkdir -pf "$REMOTE_DIR/files"
          mirror -R --delete --no-perms --ignore-time --parallel=4 _site/files "$REMOTE_DIR/files"
          mirror -R --delete --no-perms --parallel=4 --exclude "^files/" _site "$REMOTE_DIR"
          bye
          EOF
